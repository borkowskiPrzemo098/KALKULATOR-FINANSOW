name: Keep database warm

# Darmowy sposób na uniknięcie usypiania bazy danych (Neon, plan darmowy
# usypia po 5 minutach bezczynności). GitHub Actions pozwala na cron co
# 5 minut bez ograniczeń dla repozytoriów publicznych — w przeciwieństwie
# do Vercel Hobby, gdzie crony działają tylko raz dziennie.
#
# Pinguje lekki endpoint /api/health, który wykonuje trywialne zapytanie
# do bazy — wystarczy, żeby Neon nie zdążył jej uśpić.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sf -m 15 https://kalkulator-finansow.vercel.app/api/health \
            || echo "Ping nieudany — nie przerywamy joba, spróbujemy znów za 5 minut."
